# dsh-xuexi bundle 补丁
#
# 只做一件事：注册一个 Agent 预设「网课模式」。
#
# ⚠️ 重要：插件【只能】挂在预设里面的 `plugins` 列表里，
#    绝对不要再往根作用域另插一条 `include: dsh-xuexi`。否则：
#      1. 标准模式等其它模式里也会冒出 eye_*/hand_* 工具（用户明确说过不想看到）
#      2. 插件被挂载两次 → 两个 busy 标志、两个浏览器句柄 → 串行闸门失效，
#         而同一个账号禁止并行操作
#
# 界面位置（客户端的判定逻辑 isBuiltInPreset 要求 preset.name === undefined 才算内置）：
#   我们这个预设带了 name，所以归入【自定义】分组，
#   出现在 设置 → 「Agent 预设」 区块里；
#   新任务选择器则要求 通用设置 → 代码工作工具 打开后才显示。
#
# 提示词注入不在这里写：插件 index.js 会读 prompts/xuexi-mode.md，
# 通过 ctx.systemPrompt.section 注入 —— 注册继承预设作用域，只在网课模式生效。

- insert:
    - id: preset-xuexi
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: xuexi
        name: 网课模式
        description: 接管浏览器，按真实学习方式完成网课任务（原速 / 不拖拽 / 不伪造心跳）
        order: 20
        plugins:
          # 这个模式完整的子插件清单 —— 标准模式的编程工具都不在这里，所以互不干扰
          #
          # ⚠️ persona 行的两个坑（都踩过，都已修）：
          #   1. `prefix` 是 z.string().required() —— 必填！漏了会导致
          #      schema 校验失败 → fiber 启动失败 → 预设被标记「加载失败」。
          #   2. 千万不要加 `complete: true`。文档原文：
          #      「complete: true 时，提示词注册表会把这确切前缀恢复为唯一段落；
          #        身份、后缀、工具引导或监听器都无法追加提示词文本。」
          #      —— 也就是说它会把下面 dsh-xuexi 注入的 mode 提示词整个抑制掉。
          #
          # 正确组合：给一句短身份（prefix），不开 complete，
          # 让 dsh-xuexi 通过 ctx.systemPrompt.section 追加详细规则。
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: 你是网课助手：工具是你的手和眼，你负责在浏览器里判断和决定。
              includeRuntimeContext: false
          - id: xuexi
            name: dsh-xuexi
            config:
              port: 9222

          # ── 文件工具（read / write / edit / read_image）──────────────────
          #
          # ⚠️ 为什么要加（实测事故 2026-10-08）：
          #   预设的 `plugins` 列表**就是一个作用域的白名单** ——
          #   只写 [persona, xuexi] 的话，这个模式的 Agent 除了 eye_*/hand_* 之外
          #   什么工具都没有。实测日志证实：模型拿到的 30 个工具里
          #   **没有 read / write / read_image，也没有 subagent**。
          #
          #   后果有两个，都是用户直接发现的：
          #     1. 提示词里写的「复核员用 read_image 读图」根本无从执行 ——
          #        工具不存在，模型只能自己看图，体力活没派出去；
          #     2. 模型没法把截图当文件读、也没法自己写笔记文件。
          #
          #   `@deepseek-ai/dsh-tool-fs` 提供 read / write / edit / read_image。
          #   注意它**只在这个预设作用域里**生效，标准模式等其它模式不受影响。
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          # ── 上下文压缩三件套 ──────────────────────────────────────────────
          #
          # ⚠️ 为什么必须显式列出来（实测事故 2026-10-10）：
          #   网页版组合 `@deepseek-ai/dsh-web-app` 有一个 **overrides 名单**，
          #   把 `command-compact` / `compaction-basic` / `tool-result-pruner` / `tool-fs`
          #   这批插件**在宿主层直接禁用**（enabled:false / fiberPhase:null），
          #   只允许由**预设的 plugins 列表**显式加载进预设作用域。
          #
          #   实测：`include:command-compact` 宿主层 enabled:false —— 于是
          #   「/compact」这个命令在**任何模式**里都不存在，用户敲了没反应；
          #   同时 `compaction-basic` 也没加载 → **自动压缩从来没跑过**，
          #   一次 2 小时 48 分的实测把上下文涨到 35.7 万 token，一次都没缩。
          #
          #   对照组：`dsh-tool-fs` 宿主层同样 enabled:false，
          #   但 read/write/edit/read_image 能用 —— 因为上面列了它。
          #   **同一机制：列了就有，没列就没有。**
          #
          # 命令注册契约（dsh-commands 文档）：
          #   "A command-producing plugin mounted beneath an agent's own context
          #    declares its `commands` injection and registers an agent-scoped command"
          #   —— 挂进预设 = 给这个模式注册一个专属的 /compact，官方支持的用法。
          #
          # 顺序：后端（compaction-basic）在前，命令（command-compact）在后。
          # （image-offload 图片卸载宿主层已经是 active 的，不用列。）
          - id: compaction-basic
            name: '@deepseek-ai/dsh-compaction-basic'
          - id: tool-result-pruner
            name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
          - id: command-compact
            name: '@deepseek-ai/dsh-command-compact'
